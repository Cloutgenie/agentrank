services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgeslate
      POSTGRES_PASSWORD: edgeslate
      POSTGRES_DB: edgeslate
    ports:
      - "5432:5432"
    volumes:
      - edgeslate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeslate -d edgeslate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://edgeslate:edgeslate@db:5432/edgeslate
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  edgeslate_pg:
